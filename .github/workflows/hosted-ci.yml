# Every push to main, on GitHub's free hosted macOS runners (the repo is public: standard runners
# cost nothing and have no minute cap; the Free plan runs five macOS jobs at once). `xcode-27`
# matches this Mac's toolchain. The self-hosted Mac keeps release tags and a nightly run, with the
# machine-pinned suites (tests.yml). The dispatch inputs are diagnostics; a push runs everything
# once, and each input says what it falls back to then.
#
# Machine-pinned suites are skipped here (`all`): their reference images, sampled pixels, timing
# thresholds, text recognition and iCloud Drive belong to a real Mac (docs/ci.md, "Machine-pinned
# tests"). Every push gets its own run, none cancelled; GitHub queues jobs past the five.

name: hosted-ci

on:
  push:
    branches: [main]
    # Docs-only pushes start no run, as in tests.yml (see its note on the three files put back).
    paths:
      - '**'
      - '.github/**'
      - '!*.md'
      - '!docs/**'
      - 'RELEASE_NOTES.md'
      - 'README.md'
      - 'docs/releases.html'
  workflow_dispatch:
    inputs:
      suites:
        description: Run the package and app suites too (off runs only the environment report)
        type: boolean
        default: true
      packages:
        description: Run the package jobs (off runs only the environment report and the app target)
        type: boolean
        default: true
      app-copies:
        description: How many app-target jobs to run side by side, as a JSON list, e.g. [1,2,3,4,5]
        type: string
        default: '[1]'
      app-repeat:
        description: How many times each app-target job runs the tests, each in a fresh test host
        type: string
        default: '1'
      app-only-testing:
        description: Run only this test identifier in the app target, e.g. SyncCloudTests/GoMenuDuplicatesTests
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hosted-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # What the host answers for the things machine-pinned tests depend on. About a minute.
  environment:
    name: Environment
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: swift scripts/hosted-environment.swift

  packages:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'push' || (inputs.suites && inputs.packages) }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Five jobs: the Free plan's limit for macOS. Sync has a VM of its own, run as two
          # processes, because on 3 vCPUs its 3,900 tests queued on one main actor starved their
          # own waits (2026-10-29: 25 timeouts, tests taking 38-52 s that take under one here).
          - name: Sync
            slug: sync
            packages: Modules/Sync
            builds: Modules/Sync/.build
          - name: Events, Settings, CLI, Design
            slug: core   # cache keys may not contain commas
            packages: Modules/Events Modules/Settings SyncCloudCLI Modules/Design
            builds: |
              Modules/Events/.build
              Modules/Settings/.build
              SyncCloudCLI/.build
              Modules/Design/.build
          - name: Dashboard
            slug: dashboard
            packages: Modules/Dashboard
            builds: Modules/Dashboard/.build
          - name: FileExplorer
            slug: fileexplorer
            packages: Modules/FileExplorer
            builds: Modules/FileExplorer/.build
    env:
      SYNCCLOUD_SKIP_MACHINE_PINNED: all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scripts/restore-mtimes dates each file by its own last commit

      # A cached build is reused only if the sources it was built from look older than it: a fresh
      # checkout stamps every file now, so each is re-dated by its last commit first, and only what
      # a newer commit changed recompiles. Keyed by the Xcode build and the pinned dependencies;
      # every run saves its own entry and restores the newest. GitHub keeps 10 GB per repo.
      - name: Date files by their last commit
        id: toolchain
        run: |
          scripts/restore-mtimes
          echo "xcode=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "${GITHUB_OUTPUT}"
      # Restore and save are separate steps because actions/cache saves only when the job passes,
      # and the jobs that most need a warm build are the ones still going red.
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ${{ matrix.builds }}
          key: hosted-${{ matrix.slug }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Modules/*/Package.resolved', 'SyncCloudCLI/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            hosted-${{ matrix.slug }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Modules/*/Package.resolved', 'SyncCloudCLI/Package.resolved') }}-
            hosted-${{ matrix.slug }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Toolchain and machine
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          df -h "${GITHUB_WORKSPACE}" | tail -1

      # Every package runs even after a failure, and each one's build and test seconds are
      # printed on one line, in the job summary.
      - name: Build and test
        run: |
          # GitHub runs this with `bash -e`; without `+e` the first red package ends the run.
          set +e -uo pipefail
          failed=()
          for pkg in ${{ matrix.packages }}; do
            echo "::group::${pkg}"
            began=$(date +%s)
            swift build --build-tests --package-path "${pkg}"
            built=$(date +%s)
            case "${pkg}" in
              Modules/FileExplorer) scripts/test-shards "${pkg}" ;;
              Modules/Sync) scripts/test-shards --jobs 2 "${pkg}" ;;
              *) swift test --skip-build --package-path "${pkg}" ;;
            esac
            status=$?
            ended=$(date +%s)
            echo "::endgroup::"
            line="${pkg}: exit ${status}, build $((built - began)) s, tests $((ended - built)) s"
            echo "PROBE ${line}"
            echo "- ${line}" >> "${GITHUB_STEP_SUMMARY}"
            [ "${status}" -eq 0 ] || failed+=("${pkg}")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "FAILED packages: ${failed[*]}"
            exit 1
          fi

      # The restore step's own key: hashing again here would also read the Package.resolved files
      # inside the restored .build/checkouts, and every save would land under a different hash.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ matrix.builds }}
          key: ${{ steps.restore.outputs.cache-primary-key }}

  app:
    name: App target ${{ matrix.copy }}
    if: ${{ github.event_name == 'push' || inputs.suites }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(inputs.app-copies || '[1]') }}
    env:
      # xcodebuild hands a test process only the variables prefixed TEST_RUNNER_ (stripping the
      # prefix), so the plain name never reached the app's tests: SetupAccentTests, marked
      # pixelSampling, ran on the VM anyway.
      TEST_RUNNER_SYNCCLOUD_SKIP_MACHINE_PINNED: all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Date files by their last commit
        id: toolchain
        run: |
          scripts/restore-mtimes
          echo "xcode=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .dd
          key: hosted-app-${{ steps.toolchain.outputs.xcode }}-${{ github.run_id }}-${{ matrix.copy }}
          restore-keys: hosted-app-${{ steps.toolchain.outputs.xcode }}-

      - name: Toolchain
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen

      - name: App-target tests (xcodegen + xcodebuild)
        env:
          ONLY_TESTING: ${{ inputs.app-only-testing }}
          REPEAT: ${{ inputs.app-repeat || '1' }}
        run: |
          set +e -uo pipefail
          began=$(date +%s)
          xcodegen
          only=()
          [ -z "${ONLY_TESTING}" ] || only=("-only-testing:${ONLY_TESTING}")
          # The first pass builds; any further pass reruns the same build in a fresh test host.
          status=0
          for pass in $(seq 1 "${REPEAT}"); do
            action=test
            [ "${pass}" -eq 1 ] || action=test-without-building
            xcodebuild "${action}" -project SyncCloud.xcodeproj -scheme SyncCloud \
              -destination 'platform=macOS' -derivedDataPath .dd ${only[@]+"${only[@]}"}
            result=$?
            echo "PROBE pass ${pass}: exit ${result}"
            [ "${result}" -eq 0 ] || status=${result}
          done
          line="app target: exit ${status}, ${REPEAT} passes, $(( $(date +%s) - began )) s"
          echo "PROBE ${line}"
          echo "- ${line}" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .dd
          key: ${{ steps.restore.outputs.cache-primary-key }}

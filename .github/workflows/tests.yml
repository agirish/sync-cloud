# Package test suites on the self-hosted Mac runner: every v* release tag, a nightly run of main,
# and by hand. Every push to main is tested on GitHub's hosted runners instead (hosted-ci.yml).
#
# Scope: the seven SPM packages only. Suites that only produce a trustworthy
# verdict on the machine that recorded them are marked at the declaration with
# `.machinePinned(_:)` and a reason, and SYNCCLOUD_SKIP_MACHINE_PINNED below
# selects which reasons to exclude. Four reasons exist: `referenceImages`
# (compares against PNGs recorded on one Mac; see
# Modules/Design/Tests/DesignTests/SNAPSHOTS.md), `pixelSampling` (reads
# painted pixels out of a live renderer), `calibratedTiming` (the
# click-cost benchmark's thresholds) and `liveProfile` (reads the developer's
# live filing profile and real document tree).
#
# We exclude `referenceImages` and `liveProfile`, so pixel sampling and the
# benchmark still run — sound only while the runner IS the recording machine;
# see docs/ci.md.
#
# `liveProfile` is excluded for a reason worth keeping attached: because the
# runner runs as the same user on the same Mac, an `.enabled(if: profileExists)`
# gate does NOT keep such a suite off CI — the profile is right there. It ran,
# under Rosetta, at 10.8s against 1.05s natively, and since swift-testing runs
# suites in parallel it starved the timing-sensitive tests beside it and took
# ScanSupersedenceTests and DifferenceResolutionTests red on a commit that
# touched neither.
# Excluded suites still COMPILE, so breakage in their code is still caught, and
# they now report as *skipped with a reason* rather than silently vanishing.
# If the runner ever moves off this Mac, set the value to `all`.
#
# This replaced `--skip SnapshotTests`, which selected by TYPE NAME and so
# missed twelve equally machine-pinned suites (AccentPreviewTests and friends)
# that happened not to be called *SnapshotTests.
# A second step runs the app-target tests (SyncCloudTests/, via xcodegen +
# xcodebuild).

name: tests

on:
  push:
    # Routine pushes to main are tested on GitHub's hosted runners (hosted-ci.yml). This Mac runs
    # the release tags, so cutting v6.2 is verified on the recording machine with its pinned
    # suites; a nightly run of main, so pixel sampling and the timing benchmark keep a verdict;
    # and any run by hand. A maintenance line's push reads that line's own copy of this file.
    tags: ['v*']
  schedule:
    - cron: '0 10 * * *'   # 03:00 Pacific
  workflow_dispatch:
    inputs:
      clean:
        description: Build from scratch instead of from main's kept build
        type: boolean
        default: false

# A branch push never cancels a run that has started; the newest push waits for
# it, then runs. Tags and manual dispatches are never cancelled either.
#
# All branch pushes to one ref share a concurrency group. A started run always
# finishes (`cancel-in-progress: false`), and GitHub holds at most ONE *pending*
# run per group, evicting the older pending one on the next push,
# unconditionally. So a burst of landings tests the commit already running and
# then the newest one; any push between them is evicted before it starts, shows
# `cancelled` with ZERO jobs (`gh api .../actions/runs/<id>/jobs --jq
# .total_count` → 0), and has no verdict of its own. That is supersession, not
# a failure. A started run showing `cancelled` is not supersession any more:
# someone cancelled it, or the job hit its timeout.
#
# History. Per-(ref, SHA) groups (2026-08-01) gave every SHA a verdict at 4-7
# min of runner time each; 2026-08-09 moved to tip-only, where each push also
# cancelled the run in progress, so during a burst stale runs stopped starving
# the machine. Reversed in part 2026-10-28: with main's kept build a run takes
# about 14 min, and a run cancelled 20-30 min in had thrown that time away
# while the next one started cold. Letting a started run finish costs the tip
# up to one run of extra wait and gives one more commit its own verdict.
# Never `gh run rerun` a branch run: it re-enters this group and, pending,
# evicts the tip's own queued run. Use `workflow_dispatch`, which has its own.
#
# Tags and workflow_dispatch keep per-commit groups (the SHA suffix below) and
# are never cancelled: cutting v2.9 or v3.0 must get its own verdict even if
# the branch moves during the run, and a deliberate manual re-run must not be
# killable by an unrelated push. The ref stays in the key so a tag never shares
# a group with the branch push at the same commit. The only requests that can
# still evict one another are repeated dispatches of an identical (ref, SHA) —
# same checkout, same verdict — so nothing is lost.
concurrency:
  group: tests-${{ github.ref }}-${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) && 'branch-tip' || github.sha }}
  cancel-in-progress: false

jobs:
  package-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      # Where the packages and the app build. `main` keeps its builds between runs, so a push
      # recompiles only what changed: `actions/checkout` runs `git clean -ffdx`, which took the
      # in-workspace `.build` and `.dd` every run and made each one compile all seven packages
      # cold (~5 min). Tags and every other ref still build cold, in the job's temp directory,
      # so a release's verdict never rests on an earlier build; so does a dispatch with
      # `clean`. The kept build is keyed by the toolchain, and an old toolchain's is removed.
      # `.noindex` keeps Spotlight out of it, as the workspace kept it away from the app copy.
      - name: Build directory
        id: build
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = refs/heads/main ] && [ "${{ inputs.clean }}" != true ]; then
            root="${HOME}/Library/Caches/SyncCloud-ci.noindex"
            key="main-$(swift --version 2>&1 | shasum | cut -c1-12)"
            mkdir -p "${root}/${key}"
            find "${root}" -mindepth 1 -maxdepth 1 ! -name "${key}" -exec rm -rf {} +
            dir="${root}/${key}"
            echo "Kept build: ${dir} ($(du -sh "${dir}" | cut -f1))"
          else
            dir="${RUNNER_TEMP}/build"
            mkdir -p "${dir}"
            echo "Cold build: ${dir}"
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      # Run every package even after a failure so one run reports ALL broken
      # packages, not just the first.
      - name: Run package suites (reference-image suites skipped)
        env:
          # Which machine-pinned reasons to exclude. `referenceImages` alone
          # reproduces what `--skip SnapshotTests` used to do; `liveProfile`
          # keeps the developer's own document tree out of CI (and its Rosetta
          # cost off the shared runner); `all` is the setting to use if the
          # runner moves off the recording Mac.
          SYNCCLOUD_SKIP_MACHINE_PINNED: referenceImages,liveProfile
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: |
          set -uo pipefail
          failed=()
          for pkg in Modules/Sync Modules/Events Modules/Settings \
                     Modules/Design Modules/Dashboard Modules/FileExplorer \
                     SyncCloudCLI; do
            echo "::group::${pkg}"
            # arch -arm64: the agent runs as the osx-x64 build under Rosetta
            # (macOS 26 fork-bug dodge, see docs/ci.md); swift test inherits
            # x86_64 from it and then exits 1 despite passing. Forcing the
            # payload native fixes the exit code (verified both directions:
            # green suite -> 0, mutated failing test -> 1).
            # FileExplorer's suites are main-thread bound, so one test process uses one core;
            # scripts/test-shards runs them as several processes and checks the counts add up.
            scratch="${BUILD_DIR}/$(basename "${pkg}")"
            if [ "${pkg}" = Modules/FileExplorer ]; then
              run=(scripts/test-shards --scratch-path "${scratch}" "${pkg}")
            else
              run=(swift test --package-path "${pkg}" --scratch-path "${scratch}")
            fi
            if ! arch -arm64 "${run[@]}"; then
              failed+=("${pkg}")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "FAILED packages: ${failed[*]}"
            exit 1
          fi

      # App-target tests (SyncCloudTests, hosted in SyncCloud.app). Safe next
      # to a live SyncCloud instance: the app's XCTestConfigurationFilePath
      # guard stubs every window to Color.clear and skips prefs migration.
      # xcodegen by absolute path — the runner service PATH lacks Homebrew.
      # arch -arm64 for the same Rosetta exit-code reason as above.
      # DerivedData lives in the build directory above: kept on `main`, cold
      # elsewhere, and out of Spotlight either way.
      - name: App-target tests (xcodegen + xcodebuild)
        env:
          BUILD_DIR: ${{ steps.build.outputs.dir }}
          # The package step's exclusions, for the app's tests too. xcodebuild hands a test process
          # only variables prefixed TEST_RUNNER_ (stripping the prefix), so without this the app's
          # referenceImages and liveProfile suites would run here. None exists yet (2026-10-30).
          TEST_RUNNER_SYNCCLOUD_SKIP_MACHINE_PINNED: referenceImages,liveProfile
        run: |
          set -uo pipefail
          arch -arm64 /opt/homebrew/bin/xcodegen
          arch -arm64 xcodebuild test -project SyncCloud.xcodeproj \
            -scheme SyncCloud -destination 'platform=macOS' \
            -derivedDataPath "${BUILD_DIR}/dd"

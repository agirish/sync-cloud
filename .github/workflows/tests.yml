# Package test suites on every push to main, v3.x or v2.x and on every v* release
# tag, on the self-hosted Mac runner.
#
# Scope: the seven SPM packages only. Suites that only produce a trustworthy
# verdict on the machine that recorded them are marked at the declaration with
# `.machinePinned(_:)` and a reason, and SYNCCLOUD_SKIP_MACHINE_PINNED below
# selects which reasons to exclude. Three reasons exist: `referenceImages`
# (compares against PNGs recorded on one Mac; see
# Modules/Design/Tests/DesignTests/SNAPSHOTS.md), `pixelSampling` (reads
# painted pixels out of a live renderer) and `calibratedTiming` (the
# click-cost benchmark's thresholds).
#
# We exclude ONLY `referenceImages`, so pixel sampling and the benchmark still
# run — sound only while the runner IS the recording machine; see docs/ci.md.
# Excluded suites still COMPILE, so breakage in their code is still caught, and
# they now report as *skipped with a reason* rather than silently vanishing.
# If the runner ever moves off this Mac, set the value to `all`.
#
# This replaced `--skip SnapshotTests`, which selected by TYPE NAME and so
# missed twelve equally machine-pinned suites (AccentPreviewTests and friends)
# that happened not to be called *SnapshotTests.
# A second step runs the app-target tests (SyncCloudTests/, via xcodegen +
# xcodebuild).

name: tests

on:
  push:
    branches: [main, v3.x, v2.x]
    # Release tags get the full suite too: cutting v2.9 or v3.0 must not rely
    # on the branch tip having been the last thing tested.
    tags: ['v*']
  workflow_dispatch:

# Branch pushes are TIP-ONLY; tags and manual dispatches are never cancelled.
#
# A burst of landings on main or v2.x tests only the newest SHA: all branch
# pushes to one ref share a concurrency group, and `cancel-in-progress: true`
# makes each new push cancel the group's older runs — the one executing on the
# runner as well as any still queued. (Those are two separate mechanisms:
# `cancel-in-progress` governs runs that have dispatched a job, while GitHub
# separately holds at most ONE *pending* run per group and evicts the older
# pending one on the next push, unconditionally. Under this ref-wide group both
# now pull in the same direction.) A superseded run shows `cancelled`; if it was
# evicted while pending it has ZERO jobs
# (`gh api .../actions/runs/<id>/jobs --jq .total_count` → 0). Either way that
# is supersession, not a failure.
#
# This deliberately reverses the per-(ref, SHA) groups introduced 2026-08-01
# (v2.x 91248cd / main 8abb0b2). That design bought a bisectable verdict for
# every SHA at 4-7 min of runner time per commit — and the runner is the
# developer's own Mac, so during a burst stale runs starved both the machine
# and the tip's verdict. Decided 2026-08-09: the tip's verdict arriving fast is
# worth more than intermediate SHAs having their own. The cost is real, though:
# a commit superseded mid-burst has NO verdict of its own, so a break found at
# the tip may need old SHAs re-run by hand to bisect. Do that in a quiet
# moment: `gh run rerun` re-enters this same group, so a rerun of a stale SHA
# and a live tip run will cancel each other.
#
# Tags and workflow_dispatch keep per-commit groups (the SHA suffix below) and
# are never cancelled: cutting v2.9 or v3.0 must get its own verdict even if
# the branch moves during the run, and a deliberate manual re-run must not be
# killable by an unrelated push. The ref stays in the key so a tag never shares
# a group with the branch push at the same commit. The only requests that can
# still evict one another are repeated dispatches of an identical (ref, SHA) —
# same checkout, same verdict — so nothing is lost.
concurrency:
  group: tests-${{ github.ref }}-${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) && 'branch-tip' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  package-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      # Run every package even after a failure so one run reports ALL broken
      # packages, not just the first.
      - name: Run package suites (reference-image suites skipped)
        env:
          # Which machine-pinned reasons to exclude. `referenceImages` alone
          # reproduces what `--skip SnapshotTests` used to do; `all` is the
          # setting to use if the runner moves off the recording Mac.
          SYNCCLOUD_SKIP_MACHINE_PINNED: referenceImages
        run: |
          set -uo pipefail
          failed=()
          for pkg in Modules/Sync Modules/Events Modules/Settings \
                     Modules/Design Modules/Dashboard Modules/FileExplorer \
                     SyncCloudCLI; do
            echo "::group::${pkg}"
            # arch -arm64: the agent runs as the osx-x64 build under Rosetta
            # (macOS 26 fork-bug dodge, see docs/ci.md); swift test inherits
            # x86_64 from it and then exits 1 despite passing. Forcing the
            # payload native fixes the exit code (verified both directions:
            # green suite -> 0, mutated failing test -> 1).
            if ! arch -arm64 swift test --package-path "${pkg}"; then
              failed+=("${pkg}")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "FAILED packages: ${failed[*]}"
            exit 1
          fi

      # App-target tests (SyncCloudTests, hosted in SyncCloud.app). Safe next
      # to a live SyncCloud instance: the app's XCTestConfigurationFilePath
      # guard stubs every window to Color.clear and skips prefs migration.
      # xcodegen by absolute path — the runner service PATH lacks Homebrew.
      # arch -arm64 for the same Rosetta exit-code reason as above.
      # DerivedData stays inside the workspace so no Spotlight-visible app
      # copy accumulates outside it.
      - name: App-target tests (xcodegen + xcodebuild)
        run: |
          set -uo pipefail
          arch -arm64 /opt/homebrew/bin/xcodegen
          arch -arm64 xcodebuild test -project SyncCloud.xcodeproj \
            -scheme SyncCloud -destination 'platform=macOS' \
            -derivedDataPath .dd

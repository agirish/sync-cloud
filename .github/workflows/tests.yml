# Package test suites on every push to main, on the self-hosted Mac runner.
#
# Scope: the seven SPM packages only. Machine-pinned image snapshots
# (*SnapshotTests suites; see Modules/Design/SNAPSHOTS.md) are excluded via
# --skip — their reference PNGs are recorded on one machine and any other
# renderer fails them spuriously. The suites still COMPILE here, so breakage
# in snapshot test code is caught; only the pixel comparisons are skipped.
# A second step runs the app-target tests (SyncCloudTests/, via xcodegen +
# xcodebuild).

name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every commit gets its own verdict: bursts of landings queue and run
# sequentially on the single self-hosted runner rather than cancelling each
# other, so a break is bisectable to the exact SHA. A run is ~3.5 min and the
# runner is our own hardware, so per-commit cost is negligible. (If a long
# burst ever backs the queue up, cancel stale runs with `gh run cancel`.)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      # Run every package even after a failure so one run reports ALL broken
      # packages, not just the first.
      - name: Run package suites (snapshots skipped)
        run: |
          set -uo pipefail
          failed=()
          for pkg in Modules/Sync Modules/Events Modules/Settings \
                     Modules/Design Modules/Dashboard Modules/FileExplorer \
                     SyncCloudCLI; do
            echo "::group::${pkg}"
            # arch -arm64: the agent runs as the osx-x64 build under Rosetta
            # (macOS 26 fork-bug dodge, see docs/ci.md); swift test inherits
            # x86_64 from it and then exits 1 despite passing. Forcing the
            # payload native fixes the exit code (verified both directions:
            # green suite -> 0, mutated failing test -> 1).
            if ! arch -arm64 swift test --package-path "${pkg}" --skip SnapshotTests; then
              failed+=("${pkg}")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "FAILED packages: ${failed[*]}"
            exit 1
          fi

      # App-target tests (SyncCloudTests, hosted in SyncCloud.app). Safe next
      # to a live SyncCloud instance: the app's XCTestConfigurationFilePath
      # guard stubs every window to Color.clear and skips prefs migration.
      # xcodegen by absolute path — the runner service PATH lacks Homebrew.
      # arch -arm64 for the same Rosetta exit-code reason as above.
      # DerivedData stays inside the workspace so no Spotlight-visible app
      # copy accumulates outside it.
      - name: App-target tests (xcodegen + xcodebuild)
        run: |
          set -uo pipefail
          arch -arm64 /opt/homebrew/bin/xcodegen
          arch -arm64 xcodebuild test -project SyncCloud.xcodeproj \
            -scheme SyncCloud -destination 'platform=macOS' \
            -derivedDataPath .dd

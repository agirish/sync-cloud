name: SyncCloud
options:
  bundleIdPrefix: com.abhishekgirish
targets:
  SyncCloud:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MacApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    dependencies:
      - package: Sync
      - package: Events
      - package: Settings
      - package: FileExplorer
      - package: Dashboard
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © 2024. All rights reserved."
  SyncCloudTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SyncCloudTests
    dependencies:
      - target: SyncCloud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

packages:
  Sync:
    path: Modules/Sync
  Events:
    path: Modules/Events
  Settings:
    path: Modules/Settings
  FileExplorer:
    path: Modules/FileExplorer
  Dashboard:
    path: Modules/Dashboard

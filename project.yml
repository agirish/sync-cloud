name: SyncCloud
options:
  bundleIdPrefix: com.abhishekgirish
settings:
  base:
    # Every target builds ad-hoc. That is Xcode's default; it is spelled out so it holds on purpose:
    # CI must never need a keychain, and nobody else building this has the developer's certificate.
    # The copy in /Applications is signed at install time instead — see "Trying an app change" in
    # CLAUDE.md for why that matters.
    CODE_SIGN_IDENTITY: "-"
targets:
  SyncCloud:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MacApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    dependencies:
      - package: Sync
      - package: Events
      - package: Settings
      - package: FileExplorer
      - package: Dashboard
    info:
      path: MacApp/Info.plist
      properties:
        # The version this branch's builds report. `main` carries the v3 line, so its tip sits at
        # a pre-release marker for the next major; `-dev` says "this build is no release" without
        # implying a distributed beta. Cutting a release drops the suffix, tags, and re-bumps to
        # the next marker — see "Cutting a release" in CLAUDE.md, which is where this is kept
        # honest. Until 2026-08-02 this read "1.0" and had not moved since v0.10, so more than
        # twenty tagged releases all shipped claiming to be 1.0.
        CFBundleShortVersionString: "5.5-dev"
        # Build number: MAJOR * 100 + MINOR of the version above. A single integer, so it orders
        # correctly under both numeric and string comparison (2.10 → 210 sorts after 2.9 → 209,
        # which "2.10" vs "2.9" would not), it increases across both release lines at once, and
        # it is derivable from the marketing version rather than being a second thing to
        # remember. Requires MINOR < 100 to stay monotonic.
        CFBundleVersion: "505"
        NSHumanReadableCopyright: "Copyright © 2024. All rights reserved."
        # Finder's Open With lists SyncCloud for every kind of text macOS recognises: the claim is
        # the PARENT type `public.text`, and that is what keeps an install from taking a kind of file
        # away from the app that opens it. Measured 2026-10-03 in fresh Launch Services elections
        # between probe apps: a claim naming the specific type beats a parent-type claim whatever
        # their ranks, and among specific claims rank decides. A claim by EXTENSION at `Alternate`
        # was tried first and ended up the default for `.toml`, `.ini`, `.cfg` and `.ts` over
        # Antigravity's `Default` claims — and so for `.ts` videos over QuickTime — while `None`
        # drops SyncCloud from Open With altogether.
        # The cost: kinds macOS does not type as text — `.conf`, `.kt`, and `.ts`, MPEG video to it;
        # `.go` and `.rs` too, on a Mac where no app such as BBEdit declares them — are not offered
        # (Open With ▸ Other… still opens them), and text Edit does not list, such as `.rtf`, is. `ExternalOpenClaimTests` holds both halves. Arrivals go to Edit — see
        # `ExternalOpen`.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Text"
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.text]
  SyncCloudTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SyncCloudTests
      # `LogCapture`, compiled in rather than linked. Linking the `EventsTestSupport` product here
      # makes Xcode build Events as a dynamic framework and embed it in the app (measured
      # 2026-09-27: `Contents/Frameworks/Events.framework`, where the app otherwise links it
      # statically), so a test-only dependency would change how the app itself is packaged.
      - path: Modules/Events/Sources/EventsTestSupport/LogCapture.swift
    dependencies:
      - target: SyncCloud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

packages:
  Sync:
    path: Modules/Sync
  Events:
    path: Modules/Events
  Settings:
    path: Modules/Settings
  FileExplorer:
    path: Modules/FileExplorer
  Dashboard:
    path: Modules/Dashboard
